apiVersion: v1
kind: Namespace
metadata:
  name: cilium-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cilium-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: curlimages/curl
        command: ["sleep", "36000"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cilium-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:alpine

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: cilium-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: nginx:alpine

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cilium-test
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: cilium-test
spec:
  selector:
    app: database
  ports:
  - port: 80
    targetPort: 80