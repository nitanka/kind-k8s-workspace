# L7 test topology: a client plus two backend services exposing distinct
# HTTP methods/paths (via httpbin), for exercising Cilium L7 (HTTP-aware)
# CiliumNetworkPolicy rules rather than plain L3/L4 port rules.
#
# Example checks once an L7 policy is applied:
#   kubectl exec -n cilium-test deploy/client -- curl -s api-public/get
#   kubectl exec -n cilium-test deploy/client -- curl -s -X POST api-public/post
#   kubectl exec -n cilium-test deploy/client -- curl -s -X DELETE api-admin/delete
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-l7-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: k8s-l7-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: curlimages/curl
        command: ["sleep", "36000"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-public
  namespace: k8s-l7-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-public
  template:
    metadata:
      labels:
        app: api-public
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-admin
  namespace: k8s-l7-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-admin
  template:
    metadata:
      labels:
        app: api-admin
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin

---
apiVersion: v1
kind: Service
metadata:
  name: api-public
  namespace: k8s-l7-test
spec:
  selector:
    app: api-public
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: api-admin
  namespace: k8s-l7-test
spec:
  selector:
    app: api-admin
  ports:
  - port: 80
    targetPort: 80
