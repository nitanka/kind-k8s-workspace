apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: terminationgraceperiod
spec:
  applyTo:
    - groups: [""]
      versions: ["v1"]
      kinds: ["Pod"]
      operations: ["CREATE", "UPDATE"]
    - groups: ["apps"]
      versions: ["v1"]
      kinds: ["Deployment"]
      operations: ["CREATE", "UPDATE"]
  
  match:
    scope: Namespaced
    excludedNamespaces:
      - kube-local
      - kube-system
      - kyverno
      - gatekeeper-system
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
  
  location: "spec.terminationGracePeriodSeconds"
  parameters:
    assign:
      value: 30

    