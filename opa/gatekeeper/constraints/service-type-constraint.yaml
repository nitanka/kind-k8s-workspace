apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DenyLoadBalancerService
metadata:
  name: k8sservicecheck
spec:
  match:
    scope: Namespaced
    excludedNamespaces:
      - kube-local
      - kube-system
      - kyverno
      - gatekeeper-system

    kinds:
      - apiGroups: [""]
        kinds: ["Service"]