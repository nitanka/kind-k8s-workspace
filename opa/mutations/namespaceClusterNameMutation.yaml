apiVersion: mutations.gatekeeper.sh/v1
kind: AssignMetadata
metadata:
  name: mutatenamespacelabels
spec:
  match:
    scope: Clustered
    excludedNamespaces:
      - kube-public
      - kube-system
      - kyverno
      - gatekeeper-system
    kinds:
      - apiGroups: ["*"]
        kinds: ["Namespace"]
  location: "metadata.labels.cluster"
  parameters:
    assign:
      value: "kind-cluster"