apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: test-deployment
  labels:
    # Matches manifests/sidecar-clusterspiffeid.yaml's podSelector, so the
    # SPIRE controller-manager registers this pod's SA for the Envoy sidecar.
    spiffe.io/spire-managed-identity: "true"
  annotations:
    # Pulls in the "spire" injection template on top of the default
    # "sidecar" one, mounting csi.spiffe.io at /run/secrets/workload-spiffe-uds
    # for the istio-proxy container (see istiod-values-spire.yaml).
    inject.istio.io/templates: "sidecar,spire"
spec:
  containers:
    - name: nginx
      image: nginx:latest
      volumeMounts:
        - mountPath: "/run/spire/sockets"
          name: csi-volume
          readOnly: true

  volumes:
    - name: csi-volume
      csi:
        driver: csi.spiffe.io
        readOnly: true