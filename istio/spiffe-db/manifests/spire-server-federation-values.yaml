# Enables SPIRE Server's SPIFFE Federation bundle endpoint (port 8443).
# OIDC endpoint will be used by other services which needs JWT endpoint.

# jwtIssuer must be a network address relying parties can actually reach —
# not the external-looking oidc-discovery.example.org default, which isn't
# resolvable anywhere (not a real DNS zone, and a CoreDNS rewrite fixing it
# only in-cluster wouldn't survive on EKS's managed CoreDNS add-on). This
# drives both the JWT-SVID `iss` claim and the OIDC discovery document's
# `issuer` field — Vault's OIDC discovery client requires these to match
# the URL it was configured with exactly, or it rejects the endpoint.
global:
  spire:
    jwtIssuer: "https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local"

spire-server:
  federation:
    enabled: true
    bundleEndpoint:
      enabled: true
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        oidc-discovery-provider:
          # autoPopulateDNSNames only reliably adds up to the 3-label
          # short form (name.namespace.svc) — the 5-label FQDN
          # (....svc.cluster.local) is NOT guaranteed even though it's
          # what jwtIssuer above uses and what Istio's Envoy expects for
          # its own SNI/routing (a shorter hostname got a 400 from Envoy
          # even though DNS resolved fine). Add it explicitly rather than
          # relying on auto-population, so it survives pod restarts.
          dnsNameTemplates:
            - "oidc-discovery.{{ .TrustDomain }}"
            - "spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local"

# Per-pod opt-in only — NOT the namespace label. The injector webhook has a
# catch-all rule matching namespaces with no istio-injection/istio.io/rev
# label, so a pod-level annotation triggers injection without touching
# spire-server or the spire-agent/CSI-driver DaemonSets, which must stay
# out of the mesh (Istio itself depends on SPIRE for its CA material).
spiffe-oidc-discovery-provider:
  podAnnotations:
    inject.istio.io/templates: "sidecar,spire"
  podLabels:
    # sidecar.istio.io/inject must be a LABEL, not an annotation — the
    # injector webhook's objectSelector only ever matches on labels.
    sidecar.istio.io/inject: "true"
    spiffe.io/spire-managed-identity: "true"
